[project]
name = "pubmed-miner"
version = "0.1.0"
description = "Automated PubMed paper collection and essential papers recommendation system"
authors = [
    {name = "taeyoon kim", email = "deepthought@postech.ac.kr"},
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["pubmed", "papers", "research", "automation", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "biopython>=1.84",
    "pandas>=1.1.5",
    "requests>=2.32.2",
    "tqdm>=4.63.1",
    "PyYAML>=6.0",
    "PyGithub>=1.55",
    "python-dateutil>=2.8.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/partrita/pubmed-miner"
Repository = "https://github.com/partrita/pubmed-miner"
Documentation = "https://github.com/partrita/pubmed-miner#readme"
"Bug Tracker" = "https://github.com/partrita/pubmed-miner/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubmed_miner = ["data/*.json", "data/*.csv"]

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/pubmed_miner",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "external: marks tests as requiring external API access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Type checking with mypy
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "Bio.*",
]
ignore_missing_imports = true

# Linting with ruff (>= 0.16 enables ~413 stable rules by default)
[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["book_src", "dist", "htmlcov"]

[tool.ruff.lint]
# Keep ruff's expanded default rule set, excluding rules that conflict with
# deliberate design decisions in this project:
ignore = [
    # Naive datetimes are intentional: PubMed publication dates are timezone-less
    # calendar dates, and the SQLite cache stores naive timestamps via
    # sqlite3's TIMESTAMP adapters (tz-aware values would break round-tripping).
    "DTZ",
    # Broad `except Exception` at service boundaries is intentional: the scraping
    # pipeline must isolate per-item/per-request failures and keep running.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test suites intentionally assert on generic exception behavior, and
# mock-heavy tests often stack several `with patch(...)` blocks whose
# re-indentation would create excessive churn.
"tests/*" = ["B017", "SIM117"]

# Coverage configuration
[tool.coverage.run]
source = ["src/pubmed_miner"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "coverage>=7.0.0",
    "black>=24.3.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "types-PyYAML>=6.0",
]

# Import sorting compatible with Black
[tool.isort]
profile = "black"
